name: Build Application
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - nightly
    paths-ignore:
      - '**/README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > ${{ github.workspace }}/release-key.jks
          sha256sum ${{ github.workspace }}/release-key.jks

      - name: Build Release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Rename APK for release
        run: |
          cp app/build/outputs/apk/release/app-release.apk kaitou-release-nightly.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaitou-release-nightly.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create nightly release
        if: github.ref == 'refs/heads/nightly'
        uses: pyTooling/Actions/releaser@r0
        with:
          tag: nightly-release
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            kaitou-release-nightly.apk
